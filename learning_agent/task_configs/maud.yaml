# THE per-task config — loaded by harness/config.py for bench.py, judge_cli.py,
# integrity pins, and the agent runners. A task exists iff this file exists.
# Defaults here; override per run with `--config <override.yaml>`, then CLI flags.
task: maud
archetype: qa
surface: "weights + serving (submission/serve.py) + the whole answering harness
  (submission/agent.py answer/answer_batch) — the operator scores build()"

corpus: workspace_setup/tasks/maud/corpus               # 152 definitive merger agreements (MAUD deals)
corpus_version: "maud-M-095c61b5ecdb"   # derived: sha over the shipped manifest
                                        #   (see workspace_setup/tasks/maud/manifest.jsonl)
dev: workspace_setup/tasks/maud/dev.json                # 30 rows, gold + weighted rubric (readable)
test: workspace_setup/tasks/maud/test.json              # (mirror of dev for this exploratory pack)
sys: workspace_setup/tasks/maud/sys.txt
glob: "**/*.txt"
secondary: none                         # no deterministic secondary metric for legal prose

# What the workspace is composed of (explicit; the loader would default to
# the same values — spelled out so the file IS the task's full description).
toolbox:
  harnesses: [search_qa, completion_qa]    # qa starters: tool-using search agent + closed-book
  training: [sft, rl]                 # methods -> packages + data cards + AGENTS.md blocks
seed:
  dev: true                                # dev.json into the workspace
  corpus: true                             # corpus/ into the workspace

session:                                # agent-session defaults (agents/run*.sh --config)
  scaffold: modal_glm52
  track: easy
  hours: 24
