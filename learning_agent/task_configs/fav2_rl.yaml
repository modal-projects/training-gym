# fav2 variant: RL-only toolbox. Same corpus/dev/test as fav2 (extends),
# scored on the same test.json so margins are directly comparable.
task: fav2_rl
extends: fav2

# overrides fav2's toolbox wholesale (lists replace, never merge)
toolbox:
  harnesses: [search_qa]                   # one starter: the gym is the only trainer
  training: [rl]                           # -> training_gym package, rl cards, RL-only AGENTS.md

session:
  scaffold: codex_glm52
  track: easy
  hours: 24
