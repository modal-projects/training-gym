# THE per-task config — loaded by harness/config.py for bench.py, rollout.py,
# integrity pins, and the agent runners. A task exists iff this file exists.
#
# banking_knowledge is the tau2 knowledge/RAG domain: the agent answers grounded
# banking questions (and performs the resulting account actions) by retrieving
# from a 698-document product knowledge base. It ships at a LATER tau2-bench pin
# than the transactional domains (the domain's data changed after 1901a301), so
# this task pins aa74303c — the commit its corpus snapshot was taken from.
task: tau2_banking
archetype: agentic
surface: "weights only under agent.driver: native (tau2's own orchestrator,
  operator serving); driver: bridge adds serving + per-turn policy
  (submission policy_turn) — env, user-sim, and reward stay tau2's"

adapter: harness/adapters/tau2.py
dev: workspace_setup/tasks/tau2_banking/dev.json        # 24 ids — Learning Agent split, see below
test: workspace_setup/tasks/tau2_banking/test.json      # 73 ids — Learning Agent split, see below
sys: workspace_setup/tasks/tau2_banking/sys.txt
corpus: workspace_setup/tasks/tau2_banking/corpus       # study corpus: knowledge documents + db snapshot
corpus_version: "tau2-aa74303c-banking_knowledge"

# tau2 ships no split_tasks.json for this domain (97 tasks total). Learning Agent split:
#   ids = [t["id"] for t in tasks.json]; random.Random(0).shuffle(ids)
#   dev = sorted(ids[:24]); test = sorted(ids[24:])
# (25/75 since 2026-08-17; recorded in brief.md)

env:
  pin: "git+https://github.com/sierra-research/tau2-bench@aa74303ce5ff89a675297a3930b825bf1096f3fa"
  domain: banking_knowledge             # default retrieval variant ("alltools")
  max_steps: 200                        # tau2 default cap
  num_trials: 4                         # pass^4 secondary, matching the other tau2 tasks
  seed: 300
  max_concurrency: 8
  user_llm: gpt-5.6-luna                # THE customer simulator — same model for
  user_llm_args:                        #   dev and scoring (it is part of the
    reasoning_effort: low               #   environment, so a weaker dev
                                        #   stand-in would break comparability).
                                        #   Workspaces reach it keylessly via the
                                        #   operator's service: LEARNING_AGENT_USER_SIM_URL
                                        #   (harness/user_sim.py pins the model
                                        #   and holds the API key).

agent:
  driver: native                        # tau2's own llm_agent orchestrator drives
                                        #   the endpoint; agentic_toolbox loops unused
  temperature: 1.0                      # Qwen3.5 thinking-mode recipe (leaderboard
  top_p: 0.95                           #   protocol): the sampling the reward
  top_k: 20                             #   numbers are comparable under
  presence_penalty: 1.5
  max_tokens: 81920

# What the workspace is composed of (explicit; the loader would default to
# the same values — spelled out so the file IS the task's full description).
toolbox:
  harnesses: [react_env_agent, react_tool_agent, mini_swe_agent]  # agentic starters
  training: [sft, rl]                 # methods -> packages + data cards + AGENTS.md blocks
seed:
  dev: true                                # dev.json into the workspace
  corpus: true                             # (no corpus: key on env tasks -> nothing to seed)

session:                                # agent-session defaults (agents/run*.sh --config)
  scaffold: modal_glm52
  track: easy
  hours: 24
