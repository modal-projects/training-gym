# THE per-task config — loaded by harness/config.py for bench.py, judge_cli.py,
# integrity pins, and the agent runners. A task exists iff this file exists.
# Defaults here; override per run with `--config <override.yaml>`, then CLI flags.
task: openclaw
archetype: qa
surface: "weights + serving (submission/serve.py) + the whole answering harness
  (submission/agent.py answer/answer_batch) — the operator scores build()"

corpus: workspace_setup/tasks/openclaw/corpus           # OpenClaw TypeScript framework
corpus_commit: da228660
dev: workspace_setup/tasks/openclaw/dev.json
test: workspace_setup/tasks/openclaw/test.json          # HIDDEN
sys: workspace_setup/tasks/openclaw/sys.txt
glob: "**/*.ts"
secondary: ts_symbol_grounding          # fraction of referenced symbols that are real
symbols: workspace_setup/tasks/openclaw/symbols.json     # real OpenClaw symbol set (24958 symbols)

session:                                # agent-session defaults (agents/run*.sh --config)
  scaffold: modal_glm52
  track: easy
  hours: 24
