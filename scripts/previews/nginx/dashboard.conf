server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api {
        proxy_pass https://__API_HOST__;
        proxy_ssl_server_name on;
        proxy_set_header Host __API_HOST__;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
