repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix]

  - repo: local
    hooks:
      - id: regenerate-tutorials
        name: Regenerate tutorials (tutorials/generate_tutorial.py)
        entry: uv run tutorials/generate_tutorial.py
        language: system
        pass_filenames: false
        # Run only when the generator or a tutorial source file changes.
        # Regenerated outputs land in tutorials/<name>/; if they differ from
        # what's committed, pre-commit fails the commit so you can `git add`
        # the updated files and retry.
        files: ^tutorials/(generate_tutorial\.py|tutorial_generator/.*\.py)$

      - id: regenerate-models-table
        name: Regenerate Models table (scripts/generate_models_table.py)
        entry: uv run scripts/generate_models_table.py
        language: system
        pass_filenames: false
        files: ^(scripts/generate_models_table\.py|modal_training_gym/(train_recipes/.*_recipe/__init__\.py|common/models/.*\.py))$
