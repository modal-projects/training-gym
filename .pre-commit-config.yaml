repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix]

  - repo: local
    hooks:
      - id: regenerate-models-table
        name: Regenerate Models table (scripts/generate_models_table.py)
        entry: uv run scripts/generate_models_table.py
        language: system
        pass_filenames: false
        files: ^(scripts/generate_models_table\.py|modal_training_gym/(train_recipes/.*_recipe/__init__\.py|common/models/.*\.py))$
