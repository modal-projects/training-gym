name: Tests


on:
  pull_request:
  merge_group:
    types: [checks_requested]


jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Verify generated files
        run: |
          uv run tutorials/generate_tutorial.py
          git diff --exit-code -- README.md tutorials/
          test -z "$(git ls-files --others --exclude-standard -- README.md tutorials/)"
          uv run scripts/generate_llms_txt.py
          git diff --exit-code -- docs-next/public/llms.txt

      - name: Run tests
        run: uv run pytest tests/ -v
