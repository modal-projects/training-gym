<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Agent Observatory</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='none' stroke='%232e7d74' stroke-width='2'/%3E%3Ccircle cx='8' cy='8' r='2' fill='%232e7d74'/%3E%3C/svg%3E">
<script src="/assets/theme.js"></script>
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<header class="topbar">
  <a class="wordmark" href="/">Learning Agent<span class="dim">·Observatory</span></a>
  <nav style="margin-left:18px; font-size:0.85rem;">
    <a href="/docs">docs</a><a href="/tools" style="margin-left:14px;">tools</a>
  </nav>
  <span class="spacer"></span>
  <button id="theme-toggle" class="theme-toggle" title="toggle theme" aria-label="toggle theme">◐</button>
</header>

<main class="page">
  <div id="error" class="error-banner" hidden></div>

  <section id="stats" class="stats-strip" aria-label="summary stats"></section>

  <section class="panel">
    <div class="panel-head"><h2>best dev score · task × scaffold</h2><span class="faint" style="margin-left:auto">click a cell to filter</span></div>
    <div class="panel-body scroll-x"><div id="heatmap" class="empty">loading…</div></div>
  </section>

  <section class="panel">
    <div class="panel-head table-controls">
      <h2>runs</h2>
      <input id="filter-text" type="search" placeholder="filter runs…" aria-label="text filter">
      <select id="filter-state" aria-label="state filter">
        <option value="">state: all (stale hidden)</option>
        <option value="running">running</option>
        <option value="finished">finished</option>
        <option value="error">error</option>
        <option value="stale">stale</option>
        <option value="everything">everything</option>
      </select>
      <select id="filter-task" aria-label="task filter"><option value="">task: all</option></select>
      <select id="filter-track" aria-label="track filter">
        <option value="">track: all</option>
        <option value="easy">easy</option>
        <option value="medium">medium</option>
        <option value="hard">hard</option>
      </select>
      <span id="run-count" class="faint"></span>
    </div>
    <div class="scroll-x">
      <table class="data" id="runs-table">
        <thead><tr>
          <th>run</th><th>state</th><th>task</th><th>scaffold</th><th>track</th><th>agent model</th>
          <th class="r" title="best self-reported dev score (agent's own eval)">dev score</th><th class="r" title="official operator score on held-out test.json (margin vs untrained base in parentheses)">test score</th><th title="learning timeline: data/train/eval/evolve actions + invented tools, from RunRecord.learning">learning</th><th>best tag</th><th>badges</th>
          <th class="r" title="GPU-hours from runs/GPU_LOG.jsonl (seconds x GPUs per job)">gpu h</th><th class="r">cost</th><th class="r">turns</th><th class="r">duration</th><th class="r">updated</th>
        </tr></thead>
        <tbody id="runs-tbody"></tbody>
      </table>
      <div id="table-empty" class="empty" hidden>no runs match</div>
    </div>
  </section>
</main>

<noscript><div class="error-banner">The observatory needs JavaScript.</div></noscript>
<script type="module" src="/assets/index.js"></script>
</body>
</html>
